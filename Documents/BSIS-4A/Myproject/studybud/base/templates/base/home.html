{% extends 'main.html' %}

{% block content %}
    <h1>Welcome to StudyBud</h1>
    <div>
        <div>
         {% for room in rooms%}
            <div>
                 
                <span>By {{room.host.username}}</span>
                <span>{{room.topic.name}}</span>
              <h4>{{room.id}}--<a href="{% url 'room' room.id %}">{{room.name}}</a></h4>
            </div>
         {% endfor %}
        </div>
    </div>
{% endblock %}
